{% extends "biblioteca/base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<h1>Iniciar sesión</h1>
<form class="tarjeta angosta" method="post" action="{% url 'iniciar_sesion' %}" novalidate>
  {% csrf_token %}
  {% for campo in form %}
  <div class="form-fila">
    <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
    {{ campo.errors }}
  </div>
  {% endfor %}
  <button type="submit">Entrar</button>
  <p class="ayuda">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
</form>
{% endblock %}
