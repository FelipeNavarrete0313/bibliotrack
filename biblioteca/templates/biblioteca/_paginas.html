{% if pagina.paginator.num_pages > 1 %}
<nav class="paginas" aria-label="Páginas">
  {% if pagina.has_previous %}<a class="boton boton-secundario" href="?{{ consulta }}pagina={{ pagina.previous_page_number }}">← Anterior</a>{% endif %}
  <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
  {% if pagina.has_next %}<a class="boton boton-secundario" href="?{{ consulta }}pagina={{ pagina.next_page_number }}">Siguiente →</a>{% endif %}
</nav>
{% endif %}
