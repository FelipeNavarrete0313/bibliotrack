{% extends "biblioteca/base.html" %}
{% block titulo %}Editar {{ libro.titulo }}{% endblock %}
{% block contenido %}
<p><a href="{% url 'detalle_libro' libro.pk %}">← Volver al libro</a></p>
<h1>Editar libro</h1>
<form class="tarjeta angosta" method="post" action="{% url 'editar_libro' libro.pk %}">
  {% csrf_token %}
  <div class="form-fila">
    <label>ISBN</label>
    <p style="margin:0">{{ libro.isbn }} <span class="ayuda">(no se puede cambiar)</span></p>
  </div>
  {% for campo in form %}
  <div class="form-fila">
    <label for="{{ campo.id_for_label }}">{{ campo.label|capfirst }}</label>
    {{ campo }}
    {{ campo.errors }}
  </div>
  {% endfor %}
  <button type="submit">Guardar cambios</button>
</form>
{% endblock %}
