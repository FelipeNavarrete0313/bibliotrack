name: Reporte de bug
description: Algo no funciona como debería
title: "[BUG-XX] "
labels: ["tipo: bug"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1. Ir a ...
        2. Hacer clic en ...
        3. Ver el error
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: input
    id: relacionada
    attributes:
      label: Historia relacionada
      placeholder: "HU-06"
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options: [Alta, Media, Baja]
